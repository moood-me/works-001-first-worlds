<style>.c{font:600 15px/1.3 'Trebuchet MS',sans-serif;color:#2a1e2c;background:rgba(243,234,216,.88);border-radius:4px;box-shadow:0 4px 14px rgba(40,10,30,.35);overflow:hidden;width:200px}.top{height:14px;background:repeating-linear-gradient(135deg,#2a1e2c 0 12px,#f3ead8 12px 24px)}.b{padding:5px 10px 7px}.n{font-size:24px;font-weight:700}.s{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.12em}</style><div class="c"><div class="top"></div><div class="b"><div class="s">Confession on the roof</div><div class="n">Take <span id="n"></span></div><div class="s" id="f"></div></div></div><script>const u=()=>{root.getElementById('n').textContent=MooodState.get('take')||7;const f=MooodState.get('fan');root.getElementById('f').textContent=f==='blowing'?tr('wind: on'):f==='overheated'?tr('wind: overheated'):tr('wind: off');};MooodState.on('load',u);MooodState.on('change',u);u();</script>
