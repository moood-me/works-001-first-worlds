<div style="font:15px 'Helvetica Neue',Arial,sans-serif;color:#fff4e8;text-shadow:0 1px 6px rgba(40,20,50,.85);letter-spacing:.05em"><b id="t" style="display:block;font-size:28px;font-weight:300"></b><span id="n" style="opacity:.85"></span></div><script>const mins=x=>{const[h,m]=String(x).split(':').map(Number);return h*60+m;};const show=()=>{const t=MooodState.get('time')||'18:20',b=MooodState.get('bus');root.getElementById('t').textContent=t;const left=mins('18:47')-mins(t);root.getElementById('n').textContent=b==='уехал'?'седьмой ушёл':b==='стоит'?'седьмой у остановки':b==='подъезжает'?'седьмой подходит':b==='отходит'?'седьмой отходит':left>0?'до седьмого '+left+' мин':'седьмой опаздывает';};MooodState.on('load',show);MooodState.on('change',show);show();</script>
