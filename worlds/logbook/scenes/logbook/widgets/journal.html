<style>
  .closed, .book { pointer-events: auto; }
  .closed { position: absolute; left: 0; top: 0; width: 150px; height: 56px; border-radius: 28px; border: 1px solid rgba(240,200,130,.5);
    background: rgba(10,14,22,.62); color: #f6e7c8; font: 20px Georgia, serif; cursor: pointer; backdrop-filter: blur(4px); }
  .closed:hover { background: rgba(240,180,90,.22); }
  .book { display: none; position: absolute; inset: 0; border-radius: 4px 10px 10px 4px; color: #2a2016; padding: 34px 30px 60px 44px; box-sizing: border-box;
    background: repeating-linear-gradient(transparent 0 35px, rgba(70,90,140,.16) 35px 36px), linear-gradient(175deg, #f2e5c6, #e3d0a6);
    box-shadow: 0 30px 70px rgba(0,0,0,.7), inset 0 0 50px rgba(110,70,20,.25); font: 21px/1.5 Georgia, serif; overflow: hidden; }
  .book::before { content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 1px; background: rgba(170,60,50,.3); }
  .open .book { display: block; } .open .closed { display: none; }
  .jh { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: #7a5a30; text-align: center; margin-bottom: 18px; }
  .e { margin: 0 0 20px; } .d { font-size: 15px; opacity: .8; } .t { font-size: 20px; }
  .h-k { font-style: italic; color: #223153; } .h-n, .h-a { font-family: "Segoe Script", "Brush Script MT", cursive; color: #6a2b1d; }
  .h-a { color: #5b2d58; } .h-b { font-family: "Courier New", monospace; color: #303030; } .h-c, .h-m { font-family: "Comic Sans MS", cursive; color: #1f5580; }
  .h-m { color: #1f6b5a; } .h-d { color: #6f6a62; font-style: italic; } .h-e { font-family: Verdana, sans-serif; color: #1c3a8a; font-size: 17px; }
  .h-f { font-family: "Trebuchet MS", sans-serif; color: #3d4d2a; }
  .h-p .t { font-family: "Segoe Script", "Brush Script MT", cursive; color: #4c2a86; } .h-p .mine { font-size: 12px; opacity: .8; }
  .margin { display: block; margin: 6px 0 0 auto; text-align: right; font-family: "Comic Sans MS", cursive; color: #1f6b5a; font-size: 18px; transform: rotate(-2deg); }
  .nav { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
  .nav button { font: 17px Georgia, serif; border: 1px solid rgba(120,80,30,.45); background: rgba(120,80,30,.08); color: #3a2a18; border-radius: 18px; padding: 6px 16px; cursor: pointer; }
  .nav button:disabled { opacity: .3; } .pos { font-size: 14px; color: #8a6a40; }
</style>
<div id="w">
  <button class="closed" id="open">Logbook</button>
  <div class="book"><div class="jh">The lighthouse logbook</div><div id="page"></div>
    <div class="nav"><button id="prev">← Earlier</button><span class="pos" id="pos"></span><button id="next">Later →</button><button id="close">Close</button></div>
  </div>
</div>
<script>
  const BASE = [
    [tr("March 3, 1986"), "k", tr("Wind N 4, sleet. Took over the lighthouse from Efimych. He said: “Don't talk to the lamp out loud. To yourself is all right.”")],
    [tr("June 19, 1988"), "k", tr("Calm, clear. A girl from the post office came up with a month's newspapers. Her name is Nina. Asked her to come more often. “There aren't that many newspapers,” she said.")],
    [tr("June 20, 1988"), "n", tr("The newspapers ran out. Came without any. — N.")],
    [tr("November 14, 1990"), "k", tr("Wind NW 6. A woman came, cried, then laughed. Left her mittens on the railing. Let them hang, in case she comes back.")],
    [tr("August 2, 1991"), "a", tr("We got married this morning and came up here in the evening. The wind was so strong the veil flew off into the sea. Let it sail. — O. and K.")],
    [tr("May 12, 1994"), "k", tr("Wind S 2, clear. We have a son, Dmitry. Lit the light an hour early, so everyone knows. Will take the reprimand from the office gladly.")],
    [tr("January 9, 1997"), "k", tr("Storm, wind N 9. A pane cracked in the north frame. Taped it up. It holds. Mitya slept the whole night and noticed nothing.")],
    [tr("no date"), "c", tr("I was here. I am nine. The keeper let me hold the key to the lamp. It is heavy. — Lyova")],
    [tr("July 11, 2001"), "m", tr("Today I filled the lamp myself. Spilled a bit. Dad said “a bit” is half a bucket. — Mitya, age 7")],
    [tr("October 30, 2004"), "b", tr("Scheduled equipment inspection. No remarks. The keeper's tea is better than the office's. — Zhukov, technician")],
    [tr("March 6, 2008"), "k", tr("Wind E 3, fog till noon. Mitya is learning the signals. Made up one of his own: three short, one long, “I see you”. Said it will be ours.")],
    [tr("September 2, 2013"), "k", tr("Wind SW 4, rain. Mitya has gone to sea as a deckhand on the Krechet. We quarrelled. I said too much. He didn't look back from the launch."), tr("Dad, I'll keep watching for the light anyway. — M.")],
    [tr("September 17, 2014"), "k", tr("Wind SW 5. Nina has gone down to the village for good. She says a lighthouse is not a home. Maybe she's right. Promised to mend her gate.")],
    [tr("September 30, 2015"), "k", tr("NW 5, fog. The Krechet at 00:40. Gave the sign. No answer. Maybe not his watch.")],
    [tr("May 2017"), "d", tr("Leaving tomorrow for good. I wanted to see the light from above, not from below. From above it is quieter.")],
    [tr("October 4, 2018"), "k", tr("N 3, clear. The Krechet at 00:35. Sign. No answer. The wick smokes, needs changing.")],
    [tr("June 21, 2019"), "e", tr("Passed my exam. Haven't told anyone yet. Told the lighthouse. It blinked. I'll count that.")],
    [tr("February 8, 2021"), "k", tr("Wind NE 7, wet snow. A cat came. On his own, up the stairs, a hundred and twelve steps. Named him Wick. He stayed.")],
    [tr("no date"), "d", tr("A good place to be silent.")],
    [tr("October 2, 2022"), "k", tr("NW 6. The Krechet at 00:50. Sign. No answer. Nina sent up a pie. Ate it with Wick.")],
    [tr("November 14, 2023"), "a", tr("I was here exactly thirty-three years ago, and cried that day. Today I came to laugh once more. Are the mittens really still hanging there, as they say? — V.")],
    [tr("March 15, 2025"), "k", tr("Wind S 2. A letter from the office: automation next spring. They offer me a cottage in the village. Didn't answer. Wick didn't answer either.")],
    [tr("September 30, 2025"), "k", tr("NW 4. The Krechet at 00:45. Sign. No answer.")],
    [tr("August 16, 2026"), "f", tr("Walked four hours from the station. Worth it. The keeper gave us tea and asked nothing. — three with rucksacks")],
  ];
  let pages = [], E = BASE;
  // tonight's lines: the weather at midnight, the guest's own line before dawn (the scene's state)
  const today = () => new Intl.DateTimeFormat(tr.lang, { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
  const build = () => {
    E = [...BASE];
    if (MooodState.get('weather')) E.push([today() + ', 00:00', 'k', String(MooodState.get('weather'))]);
    if (MooodState.get('line')) E.push([today() + ', 05:20', 'p', String(MooodState.get('line'))]);
    pages = []; for (let i = E.length; i > 0; i -= 4) pages.unshift(E.slice(Math.max(0, i - 4), i));
  };
  build();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => root.getElementById(id);
  let p = pages.length - 1;
  const show = () => {
    $('page').innerHTML = pages[p].map(([d, h, t, note]) => '<div class="e h-' + h + '"><div class="d">' + esc(d) + (h === 'p' ? '<span class="mine"> · ' + esc(tr('your line')) + '</span>' : '') + '</div><div class="t">' + esc(t) + '</div>'
      + (note ? '<span class="margin">' + esc(note) + '</span>' : '') + '</div>').join('');
    $('pos').textContent = tr('p. {page} of {pages}', { page: p + 1, pages: pages.length });
    $('prev').disabled = p === 0; $('next').disabled = p === pages.length - 1;
  };
  const refresh = () => { const last = p === pages.length - 1; build(); if (last || p > pages.length - 1) p = pages.length - 1; if ($('w').classList.contains('open')) show(); };
  MooodState.on('load', refresh); MooodState.on('change', 'weather', refresh); MooodState.on('change', 'line', refresh);
  $('open').onclick = () => { $('w').classList.add('open'); widget.style.zIndex = 5; show(); };
  $('close').onclick = () => { $('w').classList.remove('open'); widget.style.zIndex = ''; };
  $('prev').onclick = () => { if (p > 0) { p--; show(); } };
  $('next').onclick = () => { if (p < pages.length - 1) { p++; show(); } };
</script>
