<style>.h{font:13px 'Courier New',monospace;letter-spacing:.14em;color:#cfe3dc;text-shadow:0 0 8px #000,0 1px 3px #000;text-transform:uppercase;opacity:.88}.m{font:22px 'Courier New',monospace;letter-spacing:.06em;margin-top:3px;text-transform:none}.b{display:inline-block;width:5px;margin-right:3px;background:#cfe3dc;vertical-align:baseline}.st{margin-top:4px;color:#ffc27a}</style><div class="h"><div>окно связи · ретранслятор</div><div class="m"><span id="mn"></span> &nbsp;<span id="bars"></span></div><div class="st" id="st"></div></div><script>const $=i=>root.getElementById(i);const show=()=>{const m=MooodState.get('minutes')??0;$('mn').textContent=m>0?('осталось '+m+' мин'):'закрыто';const s=MooodState.get('signal')||0;let h='';for(let i=0;i<5;i++)h+='<i class="b" style="height:'+(5+i*3)+'px;opacity:'+(s*5>i+0.5?0.9:0.2)+'"></i>';$('bars').innerHTML=h;const msg=MooodState.get('message');const p=Math.round((MooodState.get('progress')||0)*100);$('st').textContent=msg==='принимается'?('приём сообщения · '+p+'%'):msg==='получено'?'сообщение принято':msg==='оборвалось'?('приём оборван · '+p+'%'):'ждём сообщение с Земли';};MooodState.on('load',show);MooodState.on('change',show);show();</script>
