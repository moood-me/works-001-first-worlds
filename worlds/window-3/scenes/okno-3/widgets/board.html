<style>.p{font:13px 'Courier New',monospace;color:#ffb35a;background:rgba(8,10,16,.72);border:1px solid rgba(255,170,80,.3);border-radius:6px;padding:10px 14px;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,150,50,.5)}.h{font-size:11px;opacity:.7;text-transform:uppercase}.r{display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin-top:4px}.n{font-size:20px;font-weight:bold}</style><div class='p'><div class='h'>Электронная очередь · окно №3</div><div class='r'><span>Сейчас</span><span class='n' id='now'></span></div><div class='r'><span>Ваш номер</span><span class='n' id='mine'></span></div><div class='r'><span>Ожидание</span><span id='wait'></span></div></div><script>const $=id=>root.getElementById(id),pad=n=>String(Math.round(n||0)).padStart(4,'0');const show=()=>{const now=MooodState.get('now')||0,mine=MooodState.get('mine')||0,w=MooodState.get('window'),open=w==='открыто';$('now').textContent=open?pad(now):'----';$('mine').textContent=pad(mine);$('wait').textContent=open?'≈ '+Math.max(0,(mine-now)*3.6/1440).toFixed(1).replace('.',',')+' сут.':String(w||'');};MooodState.on('load',show);MooodState.on('change',show);show();</script>
