<canvas id="c" width="1300" height="540" style="width:100%;height:100%"></canvas>
<script>
  const c = root.getElementById('c'), g = c.getContext('2d'), R = [];
  for (let i = 0; i < 420; i++) R.push({ x: Math.random() * 1500 - 100, y: Math.random() * 540, l: 6 + Math.random() * 10, v: 0.8 + Math.random() * 0.5 });
  let last = performance.now();
  const f = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const W = MooodState.get('weather') || 'clear', k = W === 'storm' ? 1 : W === 'rain' ? 0.75 : W === 'drizzle' ? 0.35 : 0, wind = W === 'storm' ? 2.2 : 1;
    g.clearRect(0, 0, 1300, 540);
    if (k > 0) {
      const n = Math.floor(R.length * k);
      g.strokeStyle = 'rgba(170,185,210,' + (0.1 + 0.06 * k) + ')'; g.lineWidth = 0.7; g.beginPath();
      for (let i = 0; i < n; i++) { const r = R[i];
        r.y += 300 * r.v * dt * (0.8 + 0.4 * k); r.x += 52 * r.v * dt * wind;
        if (r.y > 545) { r.y = -12; r.x = Math.random() * 1500 - 200; }
        g.moveTo(r.x, r.y); g.lineTo(r.x - r.l * 0.17 * wind, r.y - r.l);
      }
      g.stroke();
    }
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
</script>
