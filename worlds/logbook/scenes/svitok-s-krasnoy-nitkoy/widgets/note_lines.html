<style>.n{position:absolute;left:0;right:0;bottom:0;font:italic 27px/1.45 'Cormorant Garamond',Georgia,serif;color:#c9d2e4;text-shadow:0 0 10px rgba(8,12,24,.95),0 0 3px rgba(8,12,24,.9);opacity:0;transition:opacity 2.5s ease;text-align:center;letter-spacing:.02em;white-space:pre-line}</style><div class='n' id='n'></div><script>const el=root.getElementById('n');const upd=()=>{const s=String(MooodState.get('note_state')||''),t=String(MooodState.get('note_text')||'');const on=/read/.test(s)&&t.trim().length>0;if(on&&el.textContent!==t)el.textContent=t;el.style.opacity=on?'0.88':'0';};upd();setInterval(upd,500);</script>
