<div style="font:15px 'Helvetica Neue',Arial,sans-serif;color:#fff4e8;text-shadow:0 1px 6px rgba(40,20,50,.85);letter-spacing:.05em"><b id="t" style="display:block;font-size:28px;font-weight:300"></b><span id="n" style="opacity:.85"></span></div><script>const mins=x=>{const[h,m]=String(x).split(':').map(Number);return h*60+m;};const show=()=>{const t=MooodState.get('time')||'18:20',b=MooodState.get('bus');root.getElementById('t').textContent=t;const left=mins('18:47')-mins(t);root.getElementById('n').textContent=b==='gone'?tr('the seven has gone'):b==='waiting'?tr('the seven is at the stop'):b==='arriving'?tr('the seven is coming'):b==='leaving'?tr('the seven is leaving'):left>0?tr('{left} min to the seven',{left}):tr('the seven is late');};MooodState.on('load',show);MooodState.on('change',show);show();</script>
